name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q
      - run: uv run laconic --help
      - run: uv run laconic --version | grep -Eqx 'laconic [0-9]+\.[0-9]+\.[0-9]+'
      # laconic.gates.k1/k2/k5 read only committed recorded-response
      # fixtures (mode="recorded") -- there is no live-mode flag on this
      # command at all, so CI cannot reach one; see
      # laconic.gates.k5's module docstring and .docs/DEVELOPMENT_PLAN_HISTORY.md
      # H-25. continue-on-error is deliberate: the pre-registered gates
      # are reported, not silently hidden, but an already-analyzed kill
      # condition (docs/overview.md §6.3; .docs/DEVELOPMENT_PLAN_HISTORY.md
      # H-25/H-26) must not block ordinary CI on unrelated changes --
      # only the release-verification chain in DEVELOPMENT_PLAN.md §4 is
      # meant to be blocked by it, per that section's own "a kill-condition
      # breach blocks the release until reconciliation."
      - name: gates
        continue-on-error: true
        run: uv run laconic gates --corpus tests/corpus --format json | tee gates.json
      # continue-on-error above hides a real verdict from a crash: a step
      # whose exit code is nonzero for *any* reason (K1's accepted kill,
      # an uncaught exception, a malformed report) looks identical once
      # continue-on-error swallows it. This step is deliberately NOT
      # continue-on-error: it re-reads the same report and fails the job
      # for real unless the shape is exactly the five known gates, K3 is
      # still manual, and the only kill verdict (if any) is K1's -- so a
      # broken gate runner cannot hide behind K1's already-analyzed kill.
      - name: gates verdict guard
        run: |
          uv run python -c "
          import json
          payload = json.load(open('gates.json'))
          gates = {g['gate']: g['verdict'] for g in payload['gates']}
          assert gates.keys() == {'K1', 'K2', 'K3', 'K4', 'K5'}, f'unexpected gate set: {sorted(gates)}'
          assert gates['K3'] == 'manual', f'K3 not manual: {gates[\"K3\"]}'
          unexpected_kills = [g for g, v in gates.items() if v == 'kill' and g != 'K1']
          assert not unexpected_kills, f'unexpected kill(s): {unexpected_kills}'
          print('gate suite shape OK:', gates)
          "
