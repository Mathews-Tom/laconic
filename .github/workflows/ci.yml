name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict src
      - run: uv run pytest -q
      - run: uv run laconic --help
      - run: uv run laconic --version | grep -Eqx 'laconic [0-9]+\.[0-9]+\.[0-9]+'
      # `laconic gates` reads only committed recorded-response fixtures; it
      # has no live-mode flag or provider configuration. Keep its verdicts
      # visible without allowing the pre-registered net-cost result to block
      # unrelated CI.
      - name: gates
        continue-on-error: true
        run: uv run laconic gates --corpus tests/corpus --format json | tee gates.json
      # The tolerated gates step also masks malformed output and runner
      # crashes. Re-read the report in a required step so CI accepts only the
      # declared gate set, the manual human assessment, and the known
      # net-cost kill condition.
      - name: gates verdict guard
        run: |
          uv run python -c "
          import json
          payload = json.load(open('gates.json'))
          gates = {g['gate']: g['verdict'] for g in payload['gates']}
          expected_gates = {
              'net-cost',
              'action-equivalence',
              'human-bug-catch',
              'codec-overhead',
              'reasoning-accuracy',
          }
          assert gates.keys() == expected_gates, f'unexpected gate set: {sorted(gates)}'
          assert gates['human-bug-catch'] == 'manual', (
              f'human bug catch not manual: {gates[\"human-bug-catch\"]}'
          )
          unexpected_kills = [g for g, v in gates.items() if v == 'kill' and g != 'net-cost']
          assert not unexpected_kills, f'unexpected kill(s): {unexpected_kills}'
          print('gate suite shape OK:', gates)
          "
