name: Pages

on:
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - "docs/pages/**"
      - "scripts/generate_github_pages.py"
      - "scripts/verify_github_pages.py"
      - "src/laconic/pages/**"
      - "tests/fixtures/pages/**"
      - "tests/test_github_pages.py"
      - "tests/test_pages_evidence.py"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages-${{ github.event_name }}-${{ github.event.pull_request.number || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/generate_github_pages.py
      - run: git diff --exit-code -- docs/pages
      - run: uv run python scripts/verify_github_pages.py

  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/generate_github_pages.py
      - run: git diff --exit-code -- docs/pages
      - run: uv run python scripts/verify_github_pages.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
