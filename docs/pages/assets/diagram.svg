<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="186" viewBox="0 0 1090 186" role="img" aria-labelledby="diagram-title diagram-desc" data-json-sha256="040af507d26496469914d581cd7e11c58f25ee068e7cd02e68e54289664930ee"><title id="diagram-title">Laconic recoverable transformation pipeline</title><desc id="diagram-desc">A host tool result enters the canonical runtime, passes through a tool-specific codec, stores its original in a private ledger, and reaches the agent as a smaller recovery-bearing envelope.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z"/></marker></defs><style>rect{fill:#ebe5d9;stroke:#cfc7b8}path{stroke:#244f40;stroke-width:2;fill:#244f40}text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#13231e}.number{font:700 12px ui-monospace,monospace;fill:#244f40;text-transform:uppercase}.label{font-size:18px;font-weight:800}</style><g transform="translate(20 35)"><rect width="190" height="116" rx="14"/><text class="number" x="18" y="28">01 · Host</text><text class="label" x="18" y="65">Tool result</text></g><path d="M 210 93 H 230" marker-end="url(#arrow)"/><g transform="translate(236 35)"><rect width="190" height="116" rx="14"/><text class="number" x="18" y="28">02 · Runtime</text><text class="label" x="18" y="65">Classify</text></g><path d="M 426 93 H 446" marker-end="url(#arrow)"/><g transform="translate(452 35)"><rect width="190" height="116" rx="14"/><text class="number" x="18" y="28">03 · Codec</text><text class="label" x="18" y="65">Encode</text></g><path d="M 642 93 H 662" marker-end="url(#arrow)"/><g transform="translate(668 35)"><rect width="190" height="116" rx="14"/><text class="number" x="18" y="28">04 · Ledger</text><text class="label" x="18" y="65">Retain raw</text></g><path d="M 858 93 H 878" marker-end="url(#arrow)"/><g transform="translate(884 35)"><rect width="190" height="116" rx="14"/><text class="number" x="18" y="28">05 · Agent</text><text class="label" x="18" y="65">Envelope</text></g></svg>