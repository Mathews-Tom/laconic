[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laconic"
version = "0.0.1"
description = "A context-loop codec for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Documentation = "https://github.com/Mathews-Tom/Laconic/tree/main/docs"
Repository = "https://github.com/Mathews-Tom/Laconic"

[project.scripts]
laconic = "laconic.cli:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/laconic", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["docs", "scripts/measure_session_composition.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
