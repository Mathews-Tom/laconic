[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "laconic"
version = "0.7.0"
description = "A context-loop codec for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    # Exact pins, not ranges: tree-sitter's Python binding embeds a
    # grammar-ABI version each language package is compiled against, and
    # core/grammar releases from different generations can silently
    # mismatch. A `tree-sitter>=0.25` + latest-grammar resolution (core
    # 0.26.0, grammars 0.23-0.25) reproducibly corrupted Node position data
    # under repeated parses with no exception raised — this exact 0.23.x
    # generation across every package is the pin verified crash-free.
    "tree-sitter==0.23.2",
    "tree-sitter-go==0.23.4",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-python==0.23.2",
    "tree-sitter-rust==0.23.2",
    "tree-sitter-typescript==0.23.2",
    "zstandard>=0.25.0",
]

[project.urls]
Documentation = "https://github.com/Mathews-Tom/Laconic/tree/main/docs"
Repository = "https://github.com/Mathews-Tom/Laconic"

[project.scripts]
laconic = "laconic.cli:main"

[tool.hatch.build.targets.sdist]
only-include = ["src/laconic", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "hypothesis>=6.161.6",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
