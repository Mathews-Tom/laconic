[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laconic"
version = "0.0.0"
description = "A context-loop codec for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
extend-exclude = ["docs", "scripts/measure_session_composition.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true
